[project]
name = "automate-sol-bot"
version = "0.1.0"
description = "Automated Pump.fun token sniper/trader on Solana using PumpDev, DexScreener and Jupiter."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "base58>=2.1.1",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.8",
    "requests>=2.34.2",
    "solders>=0.28.0",
    "telegramify-markdown>=1.2.0",
    "websockets>=17.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solbot"]
